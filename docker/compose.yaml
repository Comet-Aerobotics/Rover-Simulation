services:
  rover_ros:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        INPUT_GID: ${INPUT_GID:-995}
    image: aiaa-isaac-rover:humble
    container_name: aiaa_rover_dev
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROVER_CONFIG_DIR: /opt/rover/config
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/rover/fastdds.xml
    volumes:
      - ../docker/fastdds.xml:/etc/rover/fastdds.xml:ro
      - ../ros2/cometbot_ws:/workspace
      - ../config:/opt/rover/config:ro
      - /dev/input:/dev/input:ro
    device_cgroup_rules:
      - "c 13:* r"
    group_add:
      - ${INPUT_GID:-995}
    stdin_open: true
    tty: true
    command: ["bash", "-lc", "source /opt/ros/humble/setup.bash && cd /workspace && colcon build --symlink-install && source install/setup.bash && exec tail -f /dev/null"]
