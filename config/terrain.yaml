terrain:
  source_dem: assets/terrain/source/dem.npy
  source_mask: assets/terrain/source/mask.npy
  output_archive: assets/terrain/processed/lunalab_terrain.npz
  mesh_prim: /Lunalab/Terrain/terrain_mesh
  width_m: 10.0
  length_m: 6.5
  resolution_m: 0.01
  input_policy: transpose_then_crop_zero_pad
  use_mask_to_modify_elevation: false # Legacy loader retains mask as metadata; it does not mask heights.
  craters:
    enabled: false # The saved canonical USD exactly matches raw lidar01 elevations.
    count: 20
    seed: 42
    radius_min_m: 0.2
    radius_max_m: 0.8
    depth_min_m: 0.02
    depth_max_m: 0.1
  collider:
    static: true
    approximation: none
    require_mesh_collision_api: true
  deformation:
    tile_cells: 64
    update_interval_s: 0.20
    persist_deformation_on_reset: false # Stop restores the scene's starting terrain; Pause keeps current ruts.
    wheel_radius_m: 0.098
    wheel_width_m: 0.080
    contact_length_m: 0.120
    reference_load_n: 135.0
    reference_sinkage_m: 0.006
    pressure_exponent: 1.1
    maximum_sinkage_m: 0.012
    compaction_time_s: 0.30
    slip_sinkage_gain: 0.30
    displaced_volume_fraction: 0.15
    maximum_berm_m: 0.003
    contact_tolerance_m: 0.025
    maximum_stamp_spacing_m: 0.025
